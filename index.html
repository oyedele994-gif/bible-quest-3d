camera.position.y=Math.max(camera.position.y,4);camera.lookAt(target);let t=performance.now()*.001;logs.forEach(l=>{if(!l.got){l.glow.position.y=1.35+Math.sin(t*3+l.o.position.x)*.17}});animals.forEach((a,i)=>{if(a.entering){a.walkProgress=Math.min(1,a.walkProgress+dt*.32);let k=a.walkProgress,point=new THREE.Vector3(0,0,25.6);a.o.position.lerpVectors(a.start,point,k);a.o.position.y=Math.abs(Math.sin(t*8+i))*.13;if(k>=1){a.entering=false;a.o.visible=false}}else if(!a.rescued){a.o.position.x=a.home.x+Math.sin(t*.5+i)*.3;a.o.position.y=Math.abs(Math.sin(t*2+i))*.04;a.o.rotation.y=Math.sin(t*.6+i)*.16}});let shouldOpen=questStage>=1?1:0;arkDoorOpen=THREE.MathUtils.lerp(arkDoorOpen,shouldOpen,Math.min(1,dt*2));arkDoor.rotation.y=-arkDoorOpen*1.35;renderer.render(scene,camera)}camera.position.set(0,8,-12);animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
