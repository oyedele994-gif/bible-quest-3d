<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Quest 3D</title><style>body{margin:0;font-family:system-ui;background:#8ac7e8;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}#hud{position:absolute;top:12px;left:12px;background:#153e43;color:white;padding:14px;border-radius:12px}#notice{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#fff8;padding:8px;border-radius:8px}button{border:0;background:#ffd166;padding:15px;border-radius:12px;font-weight:bold}#reset{position:absolute;top:12px;right:12px}#touch{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:repeat(3,52px);gap:3px}#pick{position:absolute;bottom:25px;right:20px}</style></head><body><canvas id="view"></canvas><div id="hud"><b>📜 BIBLE QUEST 3D</b><div>Genesis 6–9 · Noah's Ark</div><div id="progress">Wood collected: 0/5</div><div id="task">Collect five logs to help Noah.</div></div><div id="notice">Explore the valley and collect wood!</div><button id="reset">↻ Restart</button><div id="touch"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="pick">PICK UP (E)</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),keys={};let p,logs,done;function reset(){p={x:0,z:0};logs=[[-7,4],[7,8],[-11,14],[10,20],[0,27]].map(([x,z])=>({x,z,got:false}));done=false;update()}function update(){let n=logs.filter(l=>l.got).length;document.querySelector('#progress').textContent='Wood collected: '+n+'/5';document.querySelector('#task').textContent=done?'Mission complete!':n===5?'Go to Noah’s Ark!':'Collect five logs to help Noah.'}function distance(o){return Math.hypot(o.x-p.x,o.z-p.z)}function pickup(){let o=logs.filter(l=>!l.got).sort((a,b)=>distance(a)-distance(b))[0];if(o&&distance(o)<3){o.got=true;document.querySelector('#notice').textContent='Great! You collected a log.';update()}else document.querySelector('#notice').textContent='Move closer to a glowing log.'}onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')pickup()};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key.toLowerCase();b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});document.querySelector('#pick').onclick=pickup;document.querySelector('#reset').onclick=reset;
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,7);g.fill()}function proj(x,z,w,h){let depth=z-p.z+12,s=Math.max(.24,1/(1+depth*.035));return {x:w/2+(x-p.x)*30*s,y:h*.72+(12-depth)*10*s,s}}function draw(t){let w=c.width=innerWidth,h=c.height=innerHeight;g.fillStyle='#8bc8e8';g.fillRect(0,0,w,h);g.fillStyle='#a6cb91';g.fillRect(0,h*.58,w,h*.42);g.fillStyle='#7eb96e';g.fillRect(0,h*.68,w,h*.32);let objs=[];for(let i=0;i<26;i++)objs.push({type:'tree',x:((i*19)%48)-24,z:(i*13)%50-5});logs.filter(l=>!l.got).forEach(l=>objs.push({...l,type:'log'}));objs.push({x:0,z:38,type:'ark'});objs.sort((a,b)=>b.z-a.z);for(let o of objs){let q=proj(o.x,o.z,w,h),s=q.s;if(o.type==='tree'){g.fillStyle='#76502a';g.fillRect(q.x-6*s,q.y-45*s,12*s,45*s);circle(q.x,q.y-82*s,44*s,'#398f49');circle(q.x-20*s,q.y-60*s,25*s,'#347c40')}if(o.type==='log'){g.fillStyle='#99612f';g.fillRect(q.x-18*s,q.y-8*s,36*s,17*s);circle(q.x,q.y-18*s,10*s+Math.sin(t*4)*2,'#ffe068');g.fillStyle='white';g.font='bold 17px system-ui';g.fillText('WOOD',q.x-27*s,q.y-30*s)}if(o.type==='ark'){g.fillStyle='#a76d3c';g.fillRect(q.x-95*s,q.y-115*s,190*s,105*s);g.fillStyle='#75411f';g.beginPath();g.moveTo(q.x-115*s,q.y-115*s);g.lineTo(q.x,q.y-165*s);g.lineTo(q.x+115*s,q.y-115*s);g.fill();g.fillStyle='#fff';g.font='bold 19px system-ui';g.fillText('NOAH’S ARK',q.x-57*s,q.y-175*s)}}let x=w/2,y=h*.74;g.fillStyle='#2f5e9c';g.fillRect(x-13,y-60,26,48);g.fillStyle='#e9b987';g.fillRect(x-10,y-81,20,22);g.fillStyle='#61412a';g.fillRect(x-11,y-83,22,7);g.fillStyle='#353333';g.fillRect(x-10,y-12,8,30);g.fillRect(x+3,y-12,8,30);if(!done&&logs.every(l=>l.got)&&Math.hypot(p.x,p.z-38)<5){done=true;document.querySelector('#notice').textContent='🎉 Mission complete! You helped Noah!';update()}}
let prev=0;function frame(ms){let dt=Math.min(.05,(ms-prev)/1000);prev=ms;let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),len=Math.hypot(x,z)||1;p.x=Math.max(-22,Math.min(22,p.x+x/len*9*dt));p.z=Math.max(-5,Math.min(42,p.z+z/len*9*dt));draw(ms/1000);requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
